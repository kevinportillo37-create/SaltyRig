        .filter-chip { flex: 0 0 auto; padding: 9px 15px; border-radius: 20px; border: 2px solid var(--border); background-color: var(--bg-card); color: var(--text-main); font-size: 0.9rem; font-weight: 700; cursor: pointer; }
        .filter-chip.active { background-color: var(--accent); border-color: var(--accent); color: #ffffff; }
        .section-title { font-size: 1rem; margin: 22px 0 10px 0; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; font-weight: 800; }
        .menu-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
        .menu-btn { background-color: var(--bg-card); border: 1px solid var(--border); border-left: 6px solid var(--accent-bright); padding: 16px 18px; border-radius: 14px; color: var(--text-main); font-size: 1.1rem; font-weight: bold; text-align: left; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 12px; transition: background 0.2s; box-shadow: 0 2px 6px rgba(107, 94, 80, 0.08); }

        #knotMenu .menu-btn { border-left-color: var(--teal-bright); }
        #knotMenu .menu-btn:active { background-color: var(--teal-soft); }

        .menu-btn .menu-sub { font-size: 0.8rem; font-weight: normal; color: var(--text-muted); }
        .menu-btn span.tag { font-size: 0.75rem; background-color: var(--accent-soft); padding: 4px 9px; border-radius: 20px; color: #b4321a; white-space: nowrap; }
        #knotMenu .menu-btn span.tag { background-color: var(--teal-soft); color: var(--teal); }
        .view { display: none; flex-direction: column; flex-grow: 1; }
        .view.active { display: flex; }
        .back-nav { display: flex; align-items: center; background: none; border: none; color: var(--teal); font-size: 1rem; font-weight: bold; padding: 8px 0; cursor: pointer; margin-bottom: 6px; width: fit-content; text-align: left; }
        .card { background-color: var(--bg-card); border: 1px solid var(--border); border-radius: 18px; padding: 16px 18px; flex-grow: 1; display: flex; flex-direction: column; box-shadow: 0 4px 14px rgba(107, 94, 80, 0.10); }
        .card h2 { font-size: 1.3rem; margin-bottom: 6px; color: var(--text-main); }
        .subtitle { font-size: 0.9rem; color: var(--accent); margin-bottom: 12px; font-weight: 700; }
        .materials-box { background-color: var(--teal-soft); border-left: 4px solid var(--teal-bright); padding: 10px 12px; border-radius: 4px 12px 12px 4px; margin-bottom: 12px; }
        .materials-box h4 { font-size: 0.85rem; color: var(--teal); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
        .materials-box p { font-size: 0.9rem; color: var(--text-main); line-height: 1.4; }
        .knot-links { display: none; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 14px; }

        .knot-chip:active { background-color: var(--teal-soft); }
        .progress { height: 8px; background-color: var(--border); border-radius: 4px; overflow: hidden; margin-bottom: 10px; }

        .step-progress { font-size: 0.85rem; font-weight: 800; color: var(--text-muted); text-transform: uppercase; margin-bottom: 8px; letter-spacing: 0.5px; }
        .step-visual { background-color: var(--picture-bg); border: 1px solid #d5ecea; border-radius: 14px; margin-bottom: 12px; }
        .step-visual svg { display: block; width: 100%; height: auto; }
        .step-visual:empty { display: none; }
        .step-text { font-size: 1.15rem; line-height: 1.5; color: var(--text-main); flex-grow: 1; display: flex; align-items: center; min-height: 80px; }
        .swipe-hint { font-size: 0.75rem; color: var(--text-muted); text-align: center; margin-top: 8px; }
        .controls { display: grid; grid-template-columns: 1fr 2fr; gap: 12px; margin-top: 10px; }
        .btn { padding: 16px; border-radius: 14px; font-size: 1.1rem; font-weight: bold; border: none; cursor: pointer; text-align: center; }
        .btn-secondary { background-color: var(--bg-card); border: 2px solid var(--border); color: var(--text-main); }
        .btn-secondary:disabled { opacity: 0.4; cursor: not-allowed; }
        .btn-primary { background-color: var(--accent); color: white; box-shadow: 0 3px 10px rgba(214, 60, 30, 0.3); }
        .btn-primary:active { background-color: #b4321a; }
        .btn-success { background-color: var(--success); color: white; box-shadow: 0 3px 10px rgba(21, 128, 61, 0.3); }
    </style>
</head>
<body>

<div class="app-container">
    <!-- HOME DASHBOARD -->

        <header>
            <h1>SaltyRig</h1>
            <p>Saltwater Rig &amp; Knot Guide · Works Offline</p>

        <div class="menu-grid" id="rigMenu"></div>

        <div class="section-title" id="knotSectionTitle">Essential Knots</div>
        <div class="menu-grid" id="knotMenu"></div>
    </div>

    <!-- INTERACTIVE GUIDE SCREEN -->
    <div id="guideView" class="view">
        <button class="back-nav" id="backNav" onclick="goBack()">← Back to Dashboard</button>
        <div class="card" id="guideCard">
            <h2 id="guideTitle">Rig Name</h2>
            <div class="subtitle" id="guideType">Category</div>

            <div class="materials-box" id="materialsContainer">
                <h4 id="materialsHeading">Required Gear</h4>
                <p id="materialsList">Materials list goes here...</p>
            </div>

            <!-- Rigs only: tap a knot to open its guide, then come back to the same step -->
            <div class="knot-links" id="knotLinks"></div>

            <div class="progress"><div class="progress-fill" id="progressFill"></div></div>
            <div class="step-progress" id="stepCounter">Step 1 of 4</div>
            <div class="step-visual" id="stepVisual"></div>
            <div class="step-text" id="stepDescription" aria-live="polite">Step instructional content goes here...</div>

            <div class="swipe-hint">Swipe left or right to change steps</div>
            <div class="controls">
                <button class="btn btn-secondary" id="backBtn" onclick="prevStep()">Back</button>
                <button class="btn btn-primary" id="nextBtn" onclick="nextStep()">Next</button>
            </div>
        </div>
    </div>
</div>

    };

    const draw = {
        line: (d, c = COL.leader, w = 4) => `<path d="${d}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`,
        // Same line with a gap around it, so it reads as passing OVER whatever is underneath
        over: (d, c = COL.leader, w = 4) => `<path d="${d}" fill="none" stroke="${COL.bg}" stroke-width="${w + 6}"/>` + draw.line(d, c, w),
        // Doubled line (two strands side by side), used for the Palomar
        dbl: (d, c = COL.leader) => draw.line(d, c, 9) + draw.line(d, COL.bg, 2.5),
        overDbl: (d, c = COL.leader) => `<path d="${d}" fill="none" stroke="${COL.bg}" stroke-width="15"/>` + draw.dbl(d, c),
        dashed: (d, c = COL.muted) => `<path d="${d}" fill="none" stroke="${c}" stroke-width="1.5" stroke-dasharray="4 4"/>`,
        arrow: (d, c = COL.arrow) => `<path d="${d}" fill="none" stroke="${c}" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrowHead)"/>`,
        label: (x, y, t, anchor = "middle", c = COL.text, size = 12) => `<text x="${x}" y="${y}" fill="${c}" font-size="${size}" font-weight="600" text-anchor="${anchor}">${t}</text>`,
        note: (x, y, t, anchor = "middle") => draw.label(x, y, t, anchor, COL.muted, 11),
        ring: (cx, cy, r = 6, c = COL.metal, w = 3) => `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${c}" stroke-width="${w}"/>`,
        highlight: (cx, cy, r = 18) => `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${COL.hl}" stroke-width="2" stroke-dasharray="4 4"/>`,
        // A finished knot: tight wraps across a horizontal line
        knot: (x, y, c = COL.leader, n = 4) => {
            let out = "";
            for (let i = 0; i < n; i++) {
                const cx = x + (i - (n - 1) / 2) * 4.5;
                out += draw.over(`M${cx + 3} ${y - 7} L${cx - 3} ${y + 7}`, c, 3);
            }
            return out;
        },
        // Same, across a vertical line
        knotV: (x, y, c = COL.leader, n = 4) => {
            let out = "";
            for (let i = 0; i < n; i++) {
                const cy = y + (i - (n - 1) / 2) * 4.5;
                out += draw.over(`M${x - 7} ${cy - 3} L${x + 7} ${cy + 3}`, c, 3);
            }
            return out;
        },
        // Wraps around a line: the back half goes under the lines, the front half over them
        coils: (x0, y, n, sp, c, h = 16) => {
            let back = "", front = "";
            for (let i = 0; i < n; i++) {
                const cx = x0 + i * sp;
                front += draw.over(`M${cx + 4} ${y - h} L${cx - 4} ${y + h}`, c, 3.5);
                if (i < n - 1) back += draw.line(`M${cx - 4} ${y + h} L${cx + sp + 4} ${y - h}`, c, 3);
            }
            return { back: `<g opacity="0.45">${back}</g>`, front };
        },
        drops: (x, y) => [0, 1].map(i => {
            const dx = x + i * 14, dy = y + i * 10;
            return `<path d="M${dx} ${dy - 9} C${dx + 6} ${dy - 2} ${dx + 6} ${dy + 4} ${dx} ${dy + 4} C${dx - 6} ${dy + 4} ${dx - 6} ${dy - 2} ${dx} ${dy - 9} Z" fill="${COL.water}"/>`;
        }).join(""),
        scissors: (x, y, angle = 0) => `<g transform="translate(${x} ${y}) rotate(${angle})" fill="none" stroke="${COL.text}" stroke-width="2.5" stroke-linecap="round"><circle cx="-11" cy="-7" r="4.5"/><circle cx="-11" cy="7" r="4.5"/><path d="M-7 -5 L13 6 M-7 5 L13 -6"/></g>`,
        dim: (x1, x2, y, t) => draw.line(`M${x1} ${y} H${x2} M${x1} ${y - 5} V${y + 5} M${x2} ${y - 5} V${y + 5}`, COL.muted, 1.5) + draw.note((x1 + x2) / 2, y - 8, t),
        check: (x, y) => draw.line(`M${x - 7} ${y} L${x - 2} ${y + 5} L${x + 8} ${y - 6}`, COL.ok, 3.5),

        // Hardware and bait
        hook: (x, y, s = 1, c = COL.metal) => { // eye on top, hangs down, point on the left
            const r = 14 * s;
            return `<g fill="none" stroke="${c}" stroke-width="3.5" stroke-linecap="round"><circle cx="${x}" cy="${y}" r="${5 * s}"/><path d="M${x} ${y + 5 * s} V${y + 48 * s} A${r} ${r} 0 0 1 ${x - 2 * r} ${y + 48 * s} V${y + 36 * s}"/></g>`
                + `<path d="M${x - 2 * r} ${y + 27 * s} l${-3 * s} ${11 * s} h${6 * s} Z" fill="${c}"/>`;
        },
        hookSide: (x, y, s = 1) => { // eye on the right, shank runs left (for knot pictures)
            const r = 11 * s;
            return `<g fill="none" stroke="${COL.metal}" stroke-width="3.5" stroke-linecap="round"><path d="M${x - 7} ${y} H${x - 46 * s} A${r} ${r} 0 0 0 ${x - 46 * s} ${y + 2 * r} H${x - 32 * s}"/></g>`
                + `<path d="M${x - 24 * s} ${y + 2 * r} l${-11 * s} ${-3 * s} v${6 * s} Z" fill="${COL.metal}"/>` + draw.ring(x, y, 7);
        },
        circleHook: (x, y, s = 1) => {
            const r = 11 * s, cx = x + r, cy = y + 24 * s;
            const ex = cx + r * Math.cos(-Math.PI / 3), ey = cy + r * Math.sin(-Math.PI / 3);
            return draw.ring(x, y, 4.5 * s)
                + `<path d="M${x} ${y + 4.5 * s} V${cy} A${r} ${r} 0 1 0 ${ex} ${ey}" fill="none" stroke="${COL.metal}" stroke-width="3.5" stroke-linecap="round"/>`
                + `<path d="M${ex - 9 * s} ${ey - 2 * s} L${ex + 2 * s} ${ey - 3 * s} L${ex + 1 * s} ${ey + 3 * s} Z" fill="${COL.metal}"/>`;
        },
        swivel: (x, y) => `<g fill="none" stroke="${COL.metal}" stroke-width="3"><circle cx="${x - 12}" cy="${y}" r="4.5"/><circle cx="${x + 12}" cy="${y}" r="4.5"/></g><rect x="${x - 7}" y="${y - 4.5}" width="14" height="9" rx="4" fill="${COL.metal}"/>`,
        cork: (x, y) => draw.line(`M${x - 56} ${y} H${x + 50}`, COL.metal, 2.5) + draw.ring(x - 61, y, 5, COL.metal, 2.5)
            + `<circle cx="${x - 40}" cy="${y}" r="4" fill="${COL.bead}"/><circle cx="${x + 40}" cy="${y}" r="4" fill="${COL.bead}"/>`
            + `<ellipse cx="${x}" cy="${y}" rx="30" ry="15" fill="${COL.cork}"/><path d="M${x + 10} ${y - 14.1} A30 15 0 0 1 ${x + 10} ${y + 14.1} Z" fill="${COL.corkTip}"/><ellipse cx="${x}" cy="${y}" rx="30" ry="15" fill="none" stroke="#c2410c" stroke-width="1.5"/>`
            + draw.swivel(x + 66, y),
        sinker: (x, y) => `<ellipse cx="${x}" cy="${y}" rx="17" ry="10.5" fill="${COL.lead}" opacity="0.92"/><ellipse cx="${x - 5}" cy="${y - 4}" rx="6" ry="2.5" fill="#ffffff" opacity="0.6"/>`,
        bead: (x, y) => `<circle cx="${x}" cy="${y}" r="5.5" fill="${COL.bead}"/>`,
        jighead: (x, y, s = 1) => { // head center at x,y; eye on top; hook point rides up, pointing back at the head
            const r = 12 * s;
            return draw.line(`M${x + 12 * s} ${y} H${x + 70 * s} A${r} ${r} 0 0 0 ${x + 70 * s} ${y - 24 * s} H${x + 58 * s}`, COL.metal, 3)
                + `<path d="M${x + 52 * s} ${y - 24 * s} l${9 * s} ${-3 * s} v${6 * s} Z" fill="${COL.metal}"/>`
                + `<circle cx="${x}" cy="${y}" r="${r}" fill="${COL.lead}"/>`
                + `<rect x="${x + 9 * s}" y="${y - 3.5 * s}" width="${9 * s}" height="${7 * s}" rx="${2 * s}" fill="${COL.lead}"/>`
                + draw.ring(x - s, y - 16 * s, 4.5 * s, COL.metal, 2.5);
        },
        // The part of a jig hook that shows above a threaded soft plastic
        jigPoint: (x, y, s = 1, topEdge = 5.3) => {
            const r = 12 * s, cx = x + 70 * s, cy = y - 12 * s, dy = (y - topEdge * s) - cy;
            const sx = cx + Math.sqrt(Math.max(r * r - dy * dy, 0));
            return draw.line(`M${sx} ${y - topEdge * s} A${r} ${r} 0 0 0 ${cx} ${y - 24 * s} H${x + 58 * s}`, COL.metal, 3)
                + `<path d="M${x + 52 * s} ${y - 24 * s} l${9 * s} ${-3 * s} v${6 * s} Z" fill="${COL.metal}"/>`;
        },
        plastic: (x1, y, len, s = 1) => { // paddle tail, nose on the left
            const b = x1 + len - 16 * s, e = x1 + len;
            return `<path d="M${x1} ${y} Q${x1} ${y - 8 * s} ${x1 + 10 * s} ${y - 8 * s} L${b} ${y - 4 * s} Q${b + 6 * s} ${y - 3.5 * s} ${b + 9 * s} ${y - 2 * s} L${e} ${y - 11 * s} Q${e + 5 * s} ${y} ${e} ${y + 11 * s} L${b + 9 * s} ${y + 2 * s} Q${b + 6 * s} ${y + 3.5 * s} ${b} ${y + 4 * s} L${x1 + 10 * s} ${y + 8 * s} Q${x1} ${y + 8 * s} ${x1} ${y} Z" fill="${COL.plastic}"/>`;
        },
        plasticFlipped: (xNose, y, len, s = 1) => `<g transform="translate(${2 * xNose} 0) scale(-1 1)">${draw.plastic(xNose, y, len, s)}</g>`,
        shrimp: (x, y) => { // head at x,y facing left, hooked under the horn
            let out = `<path d="M${x + 58} ${y + 31} l-10 13 l10 -4 l10 4 Z" fill="${COL.shrimp}"/>`;
            [[58, 27, 6.5], [50, 17, 7.5], [38, 9, 8.5], [24, 3, 10]].forEach(([dx, dy, r]) => {
                out += `<circle cx="${x + dx}" cy="${y + dy}" r="${r}" fill="${COL.shrimp}" stroke="${COL.bg}" stroke-width="1.5"/>`;
            });
            out += draw.line(`M${x - 16} ${y + 4} Q${x - 40} ${y + 10} ${x - 52} ${y + 30}`, COL.shrimp, 1.5)
                + draw.line(`M${x - 14} ${y + 6} Q${x - 30} ${y + 20} ${x - 34} ${y + 38}`, COL.shrimp, 1.5);
            for (let i = 0; i < 4; i++) out += draw.line(`M${x - 6 + i * 8} ${y + 10} l-3 9`, COL.shrimp, 1.5);
            out += `<g fill="none" stroke="${COL.metal}" stroke-width="3.5" stroke-linecap="round"><circle cx="${x - 38}" cy="${y - 49}" r="5"/><path d="M${x - 38} ${y - 44} V${y + 4} A15 15 0 0 0 ${x - 8} ${y + 4} V${y - 6}"/></g>`;
            out += `<ellipse cx="${x}" cy="${y}" rx="21" ry="12" fill="${COL.shrimp}"/>`;
            out += `<path d="M${x - 13} ${y - 8} L${x - 30} ${y - 16} L${x - 11} ${y - 4} Z" fill="${COL.shrimp}"/>`; // horn
            out += `<circle cx="${x - 15}" cy="${y - 1}" r="2.5" fill="#1a202c"/>`; // eye
            out += `<circle cx="${x + 5}" cy="${y - 1}" r="4.5" fill="${COL.spot}"/>`; // dark spot
            out += `<path d="M${x - 8} ${y - 23} l-3 11 h6 Z" fill="${COL.metal}"/>`; // hook point out the top
            return out;
        },
        lure: (x, y) => draw.line(`M${x - 12} ${y} H${x - 6}`, COL.metal, 3) + `<circle cx="${x - 26}" cy="${y}" r="14" fill="${COL.lead}"/>` + draw.ring(x, y, 7),

        // Added with the second batch of rigs and knots
        dimV: (x, y1, y2, t) => draw.line(`M${x} ${y1} V${y2} M${x - 5} ${y1} H${x + 5} M${x - 5} ${y2} H${x + 5}`, COL.muted, 1.5) + draw.note(x - 9, (y1 + y2) / 2 + 4, t, "end"),
        water: (y) => {
            let d = `M0 ${y}`;
            for (let x = 0; x < 320; x += 40) d += " q10 -6 20 0 t20 0";
            return `<rect x="0" y="${y}" width="320" height="${200 - y}" fill="#bae6fd" opacity="0.35"/>` + draw.line(d, COL.water, 2.5);
        },
        finger: (x, y, r = 10) => `<circle cx="${x}" cy="${y}" r="${r}" fill="${COL.finger}"/>`,
        splitShot: (x, y) => `<circle cx="${x}" cy="${y}" r="6.5" fill="${COL.lead}"/><path d="M${x - 6.5} ${y} H${x + 6.5}" stroke="${COL.metal}" stroke-width="1.2"/>`,
        swivelV: (x, y) => `<g fill="none" stroke="${COL.metal}" stroke-width="3"><circle cx="${x}" cy="${y - 12}" r="4.5"/><circle cx="${x}" cy="${y + 12}" r="4.5"/></g><rect x="${x - 4.5}" y="${y - 7}" width="9" height="14" rx="4" fill="${COL.metal}"/>`,
        pyramid: (x, y) => draw.ring(x, y, 3.5, COL.metal, 2.5) + `<path d="M${x} ${y + 4} L${x + 12} ${y + 30} L${x - 12} ${y + 30} Z" fill="${COL.lead}"/>`,
        sinkerSlide: (x, y) => `<rect x="${x - 11}" y="${y - 4.5}" width="22" height="9" rx="4" fill="${COL.dark}"/>` + draw.line(`M${x} ${y + 4} V${y + 10}`, COL.metal, 2) + draw.ring(x, y + 13, 3.5, COL.metal, 2.5),
        bankSinker: (x, y) => draw.ring(x, y, 3.5, COL.metal, 2.5)
            + `<path d="M${x} ${y + 4} C${x + 5} ${y + 6} ${x + 11} ${y + 16} ${x + 11} ${y + 24} Q${x + 11} ${y + 32} ${x} ${y + 32} Q${x - 11} ${y + 32} ${x - 11} ${y + 24} C${x - 11} ${y + 16} ${x - 5} ${y + 6} ${x} ${y + 4} Z" fill="${COL.lead}"/>`,
        baitChunk: (x, y) => `<rect x="${x - 15}" y="${y - 8}" width="30" height="16" rx="5" fill="#e2e8f0" stroke="${COL.metal}" stroke-width="1.5"/><rect x="${x - 14}" y="${y - 7}" width="28" height="5" rx="2.5" fill="${COL.metal}"/>`,
        spoon: (x, y, s = 1) => { // split ring at x,y; hook rides up at the tail with a wire weedguard
            const X = d => x + d * s, Y = d => y + d * s;
            return `<path d="M${X(6)} ${y} Q${X(18)} ${Y(-13)} ${X(42)} ${Y(-12)} Q${X(62)} ${Y(-9)} ${X(64)} ${y} Q${X(62)} ${Y(9)} ${X(42)} ${Y(12)} Q${X(18)} ${Y(13)} ${X(6)} ${y} Z" fill="${COL.gold}" stroke="${COL.goldEdge}" stroke-width="1.5"/>`
                + `<path d="M${X(16)} ${Y(-4)} Q${X(32)} ${Y(-9)} ${X(50)} ${Y(-6)}" fill="none" stroke="#fef08a" stroke-width="${3 * s}" stroke-linecap="round"/>`
                + draw.line(`M${X(40)} ${Y(3)} H${X(72)} A${8 * s} ${8 * s} 0 0 0 ${X(72)} ${Y(-13)} H${X(64)}`, COL.metal, 2.5)
                + `<path d="M${X(58)} ${Y(-13)} l${7 * s} ${-2.5 * s} v${5 * s} Z" fill="${COL.metal}"/>`
                + draw.line(`M${X(44)} ${Y(-2)} L${X(66)} ${Y(-18)}`, COL.metal, 1.8)
                + draw.ring(x, y, 4 * s, COL.metal, 2.5);
        },
        ewgHook: (x, y, s = 1) => { // eye on the left, z-bend, wide gap, point rides up, weight under the shank
            return `<ellipse cx="${x + 28 * s}" cy="${y + 12 * s}" rx="${9 * s}" ry="${5 * s}" fill="${COL.lead}"/>`
                + draw.line(`M${x + 4.5 * s} ${y} H${x + 10 * s} L${x + 16 * s} ${y + 8 * s} H${x + 76 * s} A${14 * s} ${14 * s} 0 0 0 ${x + 76 * s} ${y - 20 * s} H${x + 62 * s}`, COL.metal, 3)
                + `<path d="M${x + 55 * s} ${y - 20 * s} l${9 * s} ${-3 * s} v${6 * s} Z" fill="${COL.metal}"/>` + draw.ring(x, y, 4.5 * s, COL.metal, 2.5);
        },
        // A finished dropper loop standing off a vertical line
        dropperLoop: (x, y, len = 36) => draw.line(`M${x + 3} ${y - 3} C${x + 18} ${y - 12} ${x + len} ${y - 8} ${x + len} ${y} C${x + len} ${y + 8} ${x + 18} ${y + 12} ${x + 3} ${y + 3}`) + draw.knotV(x, y, COL.leader, 3),
        // FG weave: braid crisscrossing over and under the leader
        weave: (x1, x2, y, sp = 8, c = COL.braid) => {
            let under = "", over = "";
            for (let x = x1; x <= x2; x += sp) {
                over += draw.over(`M${x - 4} ${y + 8} L${x + 4} ${y - 8}`, c, 3);
                under += draw.line(`M${x + sp / 2 - 4} ${y - 8} L${x + sp / 2 + 4} ${y + 8}`, c, 3);
            }
            return { under: `<g opacity="0.6">${under}</g>`, over };
        },
        // Two strands twisted around each other (dropper loop)
        twist: (x1, x2, y, c = COL.leader, amp = 5, half = 8) => {
            let out = "";
            for (let x = x1, i = 0; x < x2; x += half, i++) {
                const s = i % 2 === 0 ? -amp : amp;
                const a = `M${x} ${y + s} C${x + half / 2} ${y + s} ${x + half / 2} ${y - s} ${x + half} ${y - s}`;
                const b = `M${x} ${y - s} C${x + half / 2} ${y - s} ${x + half / 2} ${y + s} ${x + half} ${y + s}`;
                out += i % 2 === 0 ? draw.line(a, c, 3.5) + draw.over(b, c, 3.5) : draw.line(b, c, 3.5) + draw.over(a, c, 3.5);
            }
            return out;
        },
        // Wraps around a vertical shank (snell)
        shankWraps: (x, y1, n, sp, c = COL.leader, half = 14) => {
            let back = "", front = "";
            for (let i = 0; i < n; i++) {
                const y = y1 + i * sp;
                front += draw.over(`M${x - half} ${y - 3} L${x + half} ${y + 3}`, c, 3.5);
                if (i < n - 1) back += draw.line(`M${x + half} ${y + 3} L${x - half} ${y + sp - 3}`, c, 3);
            }
            return { back: `<g opacity="0.45">${back}</g>`, front };
        }
    };

    function svgWrap(inner, title) {
        const safeTitle = title.replace(/&/g, "&amp;").replace(/"/g, "&quot;");
        return `<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${safeTitle}">`
            + `<defs><marker id="arrowHead" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="${COL.arrow}"/></marker></defs>`
            + inner + `</svg>`;
    }

    // Pieces shared by several pictures
    const pic = {
        join: (label, len) => draw.line("M12 100 H160", COL.braid) + draw.line("M160 100 H308") + draw.knot(150, 100, COL.braid) + draw.knot(170, 100)
            + draw.highlight(160, 100, 26) + draw.label(160, 64, label) + draw.note(40, 122, "braid") + draw.note(280, 122, "leader") + draw.dim(172, 308, 156, len),
        hlBase: (end = 176) => draw.line(`M140 34 V${end}`) + draw.line("M140 0 V10", COL.braid) + draw.swivelV(140, 22) + draw.knotV(140, 40),
        hlLoops: () => draw.dropperLoop(140, 80, 40) + draw.dropperLoop(140, 136, 40),
        hlHooks: () => draw.hook(180, 80, 0.6) + draw.hook(180, 136, 0.6),
        dropperHole: () => draw.line("M12 112 H100") + draw.line("M216 112 H308") + draw.twist(100, 140, 112) + draw.twist(176, 216, 112)
            + draw.line("M140 107 C150 100 166 100 176 107") + draw.line("M140 117 C150 124 166 124 176 117"),
        sdjBase: "M308 96 H75 A4 4 0 0 0 75 104 H226 C252 104 254 70 226 70 H210 L204 82",
        clinchBase: (c) => c.back + draw.line("M112 104 L128 84") + draw.line("M308 96 H75 A4 4 0 0 0 75 104 H112") + c.front,
        snellHook: () => draw.hook(200, 36, 2.1),
        weedlessHook: (bendD) => draw.line(`M57 86 H66 L72 118 H150 ${bendD}`, COL.metal, 3) + `<ellipse cx="96" cy="121" rx="11" ry="5.5" fill="${COL.lead}"/>`
    };

    // One drawing per step, in the same order as the steps above
    const stepVisuals = {
        "popping-cork": [
            () => draw.line("M12 100 H89", COL.braid) + draw.cork(150, 100) + draw.knot(80, 100, COL.braid)
                + draw.highlight(84, 100, 20) + draw.label(84, 68, "Uni Knot") + draw.note(36, 122, "braid") + draw.note(150, 136, "popping cork"),
            () => draw.line("M40 100 H262") + draw.dim(40, 262, 72, "18–24 in") + draw.scissors(282, 100, 180)
                + draw.note(151, 124, "fluorocarbon leader") + draw.note(151, 150, "up to 3 ft in deeper water"),
            () => draw.line("M12 100 H59", COL.braid) + draw.line("M198 100 H306") + draw.cork(120, 100) + draw.knot(208, 100)
                + draw.highlight(204, 100, 20) + draw.label(204, 68, "Uni or Palomar") + draw.note(30, 122, "braid") + draw.note(262, 122, "leader"),
            () => {
                const s = 0.75, ex = 238, ey = 100;
                return draw.line("M12 100 H44", COL.braid) + draw.line(`M183 100 H${ex}`) + draw.cork(105, 100) + draw.knot(228, 100)
                    + draw.jighead(ex + s, ey + 16 * s, s) + draw.highlight(262, 106, 36) + draw.label(262, 60, "jighead or hook");
            },
            () => {
                const s = 0.85, x = 26, y = 96;
                return draw.jighead(x, y, s) + draw.plastic(x + 18 * s, y, 105 * s, s) + draw.jigPoint(x, y, s)
                    + draw.note(80, 150, "soft plastic") + draw.line("M163 30 V176", COL.divider, 1.5)
                    + draw.shrimp(236, 104) + draw.note(236, 30, "hook under the horn")
                    + draw.line("M274 72 L246 99", COL.muted, 1.2) + draw.note(284, 66, "dark spot") + draw.note(236, 180, "live shrimp");
            }
        ],
        "jig-lure": [
            () => draw.line("M12 100 H160", COL.braid) + draw.line("M160 100 H308") + draw.knot(150, 100, COL.braid) + draw.knot(170, 100)
                + draw.highlight(160, 100, 26) + draw.label(160, 64, "Double Uni") + draw.note(40, 122, "braid") + draw.note(280, 122, "leader")
                + draw.dim(172, 308, 156, "20–30 in"),
            () => {
                const s = 1.2, hx = 212, hy = 118, ex = hx - s, ey = hy - 16 * s;
                return draw.line(`M12 ${ey} H${ex}`) + draw.jighead(hx, hy, s) + draw.knot(ex - 12, ey) + draw.highlight(ex - 4, ey, 20)
                    + draw.label(ex - 4, ey - 34, "Uni or loop knot") + draw.note(40, ey + 22, "leader");
            },

            () => draw.line("M12 110 H308") + draw.line("M154 116 C140 140 146 168 158 168 C170 168 176 140 162 116") + draw.knot(158, 110, COL.leader, 6)
                + draw.arrow("M60 96 H20") + draw.arrow("M260 96 H300") + draw.drops(214, 46) + draw.label(158, 192, "loop stands off the line")
        ],
        "snell-knot": [

                + draw.note(232, 112, "short end, tip", "start") + draw.note(232, 128, "past the bend", "start"),
            () => pic.snellHook() + draw.line("M207 150 V52 C207 26 288 26 294 96 C300 170 232 188 193 152 V12")
                + draw.label(92, 28, "pinch both to the shank") + draw.note(292, 190, "wide loop", "end"),
            () => {

            },

                return pic.snellHook() + w.back + draw.line("M207 150 V50") + draw.line("M193 88 V18") + w.front
                    + draw.arrow("M174 46 V14") + draw.label(104, 62, "pull the long end");
            },
            () => {
                const w = draw.shankWraps(200, 54, 6, 6);
                return pic.snellHook() + w.back + draw.line("M207 150 V50") + w.front + draw.line("M200 32 C214 6 270 6 312 10")
                    + draw.scissors(232, 156, 180) + draw.label(100, 62, "through the eye, then trim") + draw.check(286, 100);
            }
        ],
        "san-diego-jam": [
            () => draw.line("M308 96 H75 A4 4 0 0 0 75 104 H230") + draw.hookSide(75, 100) + draw.dim(75, 230, 136, "8–10 in")
                + draw.note(262, 86, "standing line") + draw.note(238, 108, "tag", "start"),
            () => draw.finger(234, 87, 8) + draw.line("M308 96 H75 A4 4 0 0 0 75 104 H226 C252 104 254 70 226 70 H196") + draw.hookSide(75, 100)
                + draw.note(236, 130, "finger") + draw.label(150, 40, "loop the tag over a finger"),
            () => {
                const c = draw.coils(200, 100, 7, -12, COL.leader, 18);
                return draw.finger(234, 87, 8) + c.back + draw.line(pic.sdjBase) + c.front + draw.line("M124 118 L114 132")
                    + draw.hookSide(75, 100) + draw.label(160, 176, "7 wraps, working toward the eye");
            },
            () => {
                const c = draw.coils(200, 100, 7, -12, COL.leader, 18);
                return draw.finger(234, 87, 8) + c.back + draw.line(pic.sdjBase) + c.front
                    + draw.over("M124 118 C114 124 108 110 110 100 C114 40 226 26 236 74") + draw.arrow("M222 34 Q238 44 240 62")
                    + draw.hookSide(75, 100) + draw.note(165, 164, "between the lines below the wraps,") + draw.note(165, 180, "then up through the finger loop");
            },
            () => {
                const c = draw.coils(118, 100, 7, -4, COL.leader, 13);
                return c.back + draw.line("M308 96 H75 A4 4 0 0 0 75 104 H122 V87") + c.front + draw.line("M90 113 L86 121") + draw.hookSide(75, 100)
                    + draw.arrow("M220 82 H290") + draw.note(255, 72, "pull it snug") + draw.drops(180, 46) + draw.scissors(104, 142, -120)
                    + draw.label(165, 182, "slide it snug, trim the tag");
            }
        ],
        "improved-clinch": [
            () => draw.line("M308 96 H75 A4 4 0 0 0 75 104 H190") + draw.hookSide(75, 100) + draw.dim(75, 190, 136, "about 6 in")
                + draw.note(255, 86, "standing line") + draw.note(198, 108, "tag", "start"),
            () => {
                const c = draw.coils(124, 96, 6, 10, COL.leader, 12);
                return pic.clinchBase(c) + draw.line("M170 108 L188 124") + draw.hookSide(75, 100)
                    + draw.label(175, 48, "5–7 wraps, away from the eye") + draw.note(94, 130, "small loop");
            },
            () => {
                const c = draw.coils(124, 96, 6, 10, COL.leader, 12);
                return pic.clinchBase(c) + draw.over("M170 108 C178 150 102 150 96 112 L95 88") + draw.arrow("M82 138 V106")
                    + draw.hookSide(75, 100) + draw.note(136, 132, "big loop") + draw.label(160, 184, "back through the small loop");
            },
            () => {
                const c = draw.coils(124, 96, 6, 10, COL.leader, 12);
                return pic.clinchBase(c) + draw.over("M170 108 C178 150 102 150 96 112 L95 88") + draw.over("M95 88 C100 58 150 62 140 124")
                    + draw.arrow("M160 84 Q160 104 148 116") + draw.hookSide(75, 100) + draw.label(160, 184, "then through the big loop");
            },
            () => {
                const c = draw.coils(86, 96, 6, 4, COL.leader, 10);
                return c.back + draw.line("M308 96 H75 A4 4 0 0 0 75 104 H86 L90 86") + c.front + draw.line("M102 106 L108 116") + draw.hookSide(75, 100)
                    + draw.arrow("M220 82 H290") + draw.note(255, 72, "pull the standing line") + draw.drops(180, 46) + draw.scissors(126, 136, -120)
                    + draw.label(165, 182, "wet it, snug it down, trim");
            }
        ]
    };

    // App state
    let activeType = "rigs";
    let activeItems = appData.rigs;
    let currentItemIndex = 0;
    let currentStepIndex = 0;
    let wakeLock = null;

    // Species filter (remembered between visits on this phone)
    const SPECIES = [["all", "All"], ["trout", "Trout"], ["redfish", "Redfish"], ["flounder", "Flounder"], ["drum", "Drum"]];
    let speciesFilter = "all";
    try { speciesFilter = localStorage.getItem("saltyrig-species") || "all"; } catch (err) { /* storage blocked; use All */ }
    if (!SPECIES.some(([key]) => key === speciesFilter)) speciesFilter = "all";

    function buildFilterBar() {
        const bar = document.getElementById("filterBar");
        bar.innerHTML = "";
        SPECIES.forEach(([key, name]) => {
            const chip = document.createElement("button");
            chip.className = "filter-chip" + (key === speciesFilter ? " active" : "");
            chip.textContent = name;
            chip.setAttribute("aria-pressed", key === speciesFilter ? "true" : "false");
            chip.onclick = () => setSpecies(key);
            bar.appendChild(chip);
        });
    }

    function setSpecies(key) {
        speciesFilter = key;
        try { localStorage.setItem("saltyrig-species", key); } catch (err) { /* not saved; filter still works */ }
        buildFilterBar();
        buildMenus();
    }

    // Shows the rigs for the chosen species, and only the knots those rigs use
    function buildMenus() {
        const all = speciesFilter === "all";
        const rigIndexes = appData.rigs.map((_, i) => i).filter(i => all || (appData.rigs[i].species || []).includes(speciesFilter));
        const usedKnots = new Set(rigIndexes.flatMap(i => appData.rigs[i].knots || []));
        const knotIndexes = appData.knots.map((_, i) => i).filter(i => all || usedKnots.has(appData.knots[i].id));
        buildMenu("rigs", "rigMenu", rigIndexes);
        buildMenu("knots", "knotMenu", knotIndexes);
        const name = (SPECIES.find(([key]) => key === speciesFilter) || SPECIES[0])[1];
        document.getElementById("rigSectionTitle").innerText = all ? "Popular Rigs" : `Rigs for ${name}`;
        document.getElementById("knotSectionTitle").innerText = all ? "Essential Knots" : "Knots for These Rigs";
    }

    function initApp() {
        buildFilterBar();
        buildMenus();
        setupSwipe();
        registerServiceWorker();

        // Reopen the guide you were on if the page reloads
        const state = history.state;
        if (state && state.type && appData[state.type] && appData[state.type][state.index]) {
            openGuide(state.type, state.index, state.step || 0, false);
        }
    }

    function buildMenu(type, containerId, indexes = appData[type].map((_, i) => i)) {
        const container = document.getElementById(containerId);
        container.innerHTML = "";
        indexes.forEach(index => {
            const item = appData[type][index];
            const btn = document.createElement("button");
            btn.className = "menu-btn";

            const text = document.createElement("span");
            text.className = "menu-text";
            const title = document.createElement("span");
            title.textContent = item.title;
            const sub = document.createElement("span");
            sub.className = "menu-sub";
            sub.textContent = item.subtitle.replace(/^(Targeting|Category):\s*/, "");
            text.append(title, sub);

            const tag = document.createElement("span");
            tag.className = "tag";
            tag.textContent = `${item.steps.length} steps`;

            btn.append(text, tag);
            btn.onclick = () => openGuide(type, index);
            container.appendChild(btn);
        });
    }

    function findById(id) {
        for (const type of Object.keys(appData)) {
            const index = appData[type].findIndex(item => item.id === id);
            if (index !== -1) return { type, index };
        }
        return null;
    }

    function showView(viewId) {
        document.querySelectorAll(".view").forEach(view => view.classList.remove("active"));
        document.getElementById(viewId).classList.add("active");
        window.scrollTo(0, 0);
    }

    // push = true adds a history entry so the phone's back button returns here
    function openGuide(type, index, startStep = 0, push = true) {
        activeType = type;
        activeItems = appData[type];
        currentItemIndex = index;
        currentStepIndex = startStep;

        if (push) {
            const prev = history.state;
            const from = (prev && prev.type === "rigs" && type === "knots") ? prev.index : null;
            history.pushState({ type, index, step: startStep, from }, "");
        }

        renderStep();
        showView("guideView");
        requestWakeLock();
    }

    function showHome() {
        showView("homeView");
        releaseWakeLock();
    }

    // Back link, Done button and phone back button all go through history
    function goBack() {
        if (history.state && history.state.type) {
            history.back();
        } else {
            showHome();
        }
    }

    window.addEventListener("popstate", event => {
        const state = event.state;
        if (state && state.type && appData[state.type] && appData[state.type][state.index]) {
            openGuide(state.type, state.index, state.step || 0, false);
        } else {
            showHome();
        }
    });

    function renderStep() {
        const item = activeItems[currentItemIndex];
        const total = item.steps.length;
        const isRig = activeType === "rigs";

        document.getElementById("guideTitle").innerText = item.title;
        document.getElementById("guideType").innerText = item.subtitle;
        document.getElementById("materialsHeading").innerText = isRig ? "Required Gear" : "About This Knot";
        document.getElementById("materialsList").innerText = item.materials;
        document.getElementById("stepCounter").innerText = `Step ${currentStepIndex + 1} of ${total}`;
        document.getElementById("stepDescription").innerText = item.steps[currentStepIndex];

        // Picture for this step (hidden if a step doesn't have one yet)
        const pictures = stepVisuals[item.id];
        const drawStep = pictures && pictures[currentStepIndex];
        document.getElementById("stepVisual").innerHTML = drawStep
            ? svgWrap(drawStep(), `${item.title}, step ${currentStepIndex + 1}`)
            : "";

        const fill = document.getElementById("progressFill");
        fill.style.width = `${((currentStepIndex + 1) / total) * 100}%`;
        fill.classList.toggle("complete", currentStepIndex === total - 1);

        renderKnotLinks(item, isRig);

        // Back link says where it goes
        const state = history.state;
        const fromRig = state && state.from !== null && state.from !== undefined ? appData.rigs[state.from] : null;
        document.getElementById("backNav").innerText = fromRig ? `← Back to ${fromRig.title}` : "← Back to Dashboard";

        // Button logic rules
        document.getElementById("backBtn").disabled = (currentStepIndex === 0);
        const nextBtn = document.getElementById("nextBtn");
        if (currentStepIndex === total - 1) {
            nextBtn.innerText = "Done";
            nextBtn.className = "btn btn-success";
        } else {
            nextBtn.innerText = "Next";
            nextBtn.className = "btn btn-primary";
        }

        // Remember the step so back/reload lands on the same one
        if (state && state.type === activeType && state.index === currentItemIndex) {
            history.replaceState({ ...state, step: currentStepIndex }, "");
        }
    }

    function renderKnotLinks(item, isRig) {
        const box = document.getElementById("knotLinks");
        box.innerHTML = "";
        if (!isRig || !item.knots || item.knots.length === 0) {
            box.classList.remove("visible");
            return;
        }
        const label = document.createElement("span");
        label.className = "label";
        label.textContent = "Knots:";
        box.appendChild(label);

        item.knots.forEach(knotId => {
            const found = findById(knotId);
            if (!found) return;
            const knot = appData[found.type][found.index];
            const chip = document.createElement("button");
            chip.className = "knot-chip";
            chip.textContent = knot.title.replace(/^The\s+/, "");
            chip.onclick = () => openGuide(found.type, found.index);
            box.appendChild(chip);
        });
        box.classList.add("visible");
    }

    function nextStep() {
        const item = activeItems[currentItemIndex];
        if (currentStepIndex < item.steps.length - 1) {
            currentStepIndex++;
            renderStep();
        } else {
            goBack(); // Finished all steps: back to the rig you came from, or home
        }
    }

    function prevStep() {
        if (currentStepIndex > 0) {
            currentStepIndex--;
            renderStep();
        }
    }

    // Swipe left for next step, right for previous (never exits the guide)
    function setupSwipe() {
        const card = document.getElementById("guideCard");
        let startX = 0, startY = 0;
        card.addEventListener("touchstart", e => {
            startX = e.changedTouches[0].clientX;
            startY = e.changedTouches[0].clientY;
        }, { passive: true });
        card.addEventListener("touchend", e => {
            const dx = e.changedTouches[0].clientX - startX;
            const dy = e.changedTouches[0].clientY - startY;
            if (Math.abs(dx) < 50 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
            const item = activeItems[currentItemIndex];
            if (dx < 0 && currentStepIndex < item.steps.length - 1) {
                currentStepIndex++;
                renderStep();
            } else if (dx > 0) {
                prevStep();
            }
        }, { passive: true });
    }

    // Keep the screen from dimming while a guide is open (wet hands, no tapping)
    async function requestWakeLock() {
        try {
            if ("wakeLock" in navigator && !wakeLock) {
                wakeLock = await navigator.wakeLock.request("screen");
                wakeLock.addEventListener("release", () => { wakeLock = null; });
            }
        } catch (err) {
            wakeLock = null; // Not supported or not allowed; app works the same without it
        }
    }

    function releaseWakeLock() {
        if (wakeLock) {
            wakeLock.release().catch(() => {});
            wakeLock = null;
        }
    }

    document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible" && document.getElementById("guideView").classList.contains("active")) {
            requestWakeLock();
        }
    });

    // Real offline support: sw.js caches the app so it opens with no signal.
    // Service workers only run from http(s), so this is skipped if the file is opened directly.
    function registerServiceWorker() {
        if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
            navigator.serviceWorker.register("sw.js").catch(() => {});
        }
    }

    window.onload = initApp;
</script>
